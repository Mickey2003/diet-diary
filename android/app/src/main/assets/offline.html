<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>无法连接</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px;
    background: #f5f5f5;
    color: #333;
    text-align: center;
  }
  .icon { font-size: 72px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin-bottom: 12px; color: #222; }
  p { font-size: 15px; color: #666; margin-bottom: 32px; line-height: 1.6; }
  button {
    padding: 12px 36px;
    font-size: 16px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: #388E3C; }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>无法连接到服务器</h1>
  <p>请检查网络连接和服务器状态，<br/>然后点击下方按钮重试。</p>
  <button onclick="if(window.DietDiaryNative)DietDiaryNative.reload();else window.location.reload()">重 试</button>
</body>
</html>
