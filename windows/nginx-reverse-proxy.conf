# 宝塔 Nginx 站点 diet-diary.720172.xyz —— 反向代理到本机 FastAPI（8000）
# 用法：站点「设置」→「配置文件」，把下面的 location 与参数放进 server { } 内
#（如果已经用宝塔的「反向代理」功能生成了 proxy 配置，只需补上带 ★ 的几行）。

client_max_body_size 30m;                       # ★ 照片上传

gzip on;                                        # 后端已 gzip，Nginx 这里再开无害
gzip_min_length 1k;
gzip_types text/plain text/css application/json application/javascript application/octet-stream image/svg+xml;

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # ★ 后端据此签发 Secure Cookie
    proxy_read_timeout 300s;                       # ★ App 实时通知长轮询（最长 25 秒）
    proxy_send_timeout 90s;
    proxy_connect_timeout 10s;
    proxy_buffering off;                          # 长轮询即时返回
}

# 前端静态资源文件名带内容哈希，后端已返回一年 immutable 缓存；Nginx 无需额外处理。
